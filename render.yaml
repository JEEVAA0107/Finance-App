services:
  - type: web
    name: finance-app-awae
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install --ignore-scripts && npx prisma generate
    startCommand: npx prisma db push --accept-data-loss && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUPPETEER_SKIP_CHROMIUM_DOWNLOAD
        value: "true"
      - key: DISABLE_WHATSAPP
        value: "true"
      - key: npm_config_puppeteer_skip_chromium_download
        value: "true"
